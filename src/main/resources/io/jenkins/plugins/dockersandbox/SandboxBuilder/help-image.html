<div>Run in this Docker image instead of a kit: an OCI reference such as <code>node:22</code> or <code>maven:3.9-eclipse-temurin-21</code>, or a managed image <code>images/&lt;id&gt;</code>. Overrides <code>kit</code> and the global defaults; no kit is sent. The image must provide <code>bash</code> and <code>tar</code>. With an image the work directory defaults to <code>/tmp/workspace</code>.</div>
